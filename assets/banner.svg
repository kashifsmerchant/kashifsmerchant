<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="t d">
  <title id="t">Kashif Merchant</title>
  <desc id="d">Product leader building agentic applications, platforms, and teams. Decisions you can inspect. Changes you can test. Outcomes you can verify.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17242a"/>
      <stop offset="1" stop-color="#0f1b21"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#d95631" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d95631" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="380" rx="22"/></clipPath>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .flow { fill: none; stroke: #f27a56; stroke-linecap: round; stroke-width: 1.6; stroke-dasharray: 22 46; animation: wind 7s linear infinite; }
      .flow.a { stroke-opacity: .2; }
      .flow.b { stroke-opacity: .12; animation-duration: 9s; }
      .scan { animation: scan 9s ease-in-out infinite; }
      .flag { animation: pulse 3s ease-in-out infinite; }
      @keyframes wind { to { stroke-dashoffset: -272; } }
      @keyframes scan {
        0%, 6% { transform: translateY(0); }
        20%, 26% { transform: translateY(34px); }
        40%, 46% { transform: translateY(68px); }
        60%, 66% { transform: translateY(102px); }
        80%, 86% { transform: translateY(136px); }
        100% { transform: translateY(0); }
      }
      @keyframes pulse { 0%, 100% { stroke-opacity: .95; } 50% { stroke-opacity: .35; } }
      @media (prefers-reduced-motion: reduce) { .flow, .scan, .flag { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="380" fill="url(#bg)"/>
    <rect width="1280" height="380" fill="url(#grid)"/>
    <rect width="1280" height="380" fill="url(#glow)"/>
